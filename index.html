<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101218"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RepTrack"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>RepTrack — Gym Progress</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f5f8;background:#101218}*{box-sizing:border-box}body{margin:0;padding:0 0 95px}header{padding:24px 20px 14px;background:#171a22;position:sticky;top:0;z-index:2;border-bottom:1px solid #2a2e3a}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{margin:0 0 10px;font-size:15px}.muted{color:#a5a9b7;font-size:13px}.wrap{max-width:650px;margin:auto;padding:18px 16px}.card{background:#1b1f29;border:1px solid #303544;border-radius:17px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{font-size:26px;font-weight:800;color:#b4f26c}.pill{background:#2b3540;border-radius:20px;padding:5px 9px;font-size:12px;display:inline-block}.btn,button{background:#b4f26c;color:#11160e;border:0;border-radius:11px;padding:12px 14px;font-weight:750;font-size:14px;cursor:pointer}.secondary{background:#303644;color:#f2f4fa}.danger{background:#5a2832;color:#fff}.tiny{padding:7px 9px;font-size:12px}input,select,textarea{width:100%;background:#11151e;border:1px solid #414756;border-radius:10px;padding:12px;color:white;font:inherit;margin:5px 0 11px}label{font-size:13px;color:#c8ccd5}nav{position:fixed;bottom:0;left:0;right:0;background:#171a22;border-top:1px solid #353947;display:flex;justify-content:space-around;padding:10px 2px max(12px,env(safe-area-inset-bottom));z-index:3}nav button{background:none;color:#a9adba;font-size:11px;padding:5px 3px;min-width:19%;display:grid;gap:4px;justify-items:center}nav button.active{color:#b4f26c}nav span{font-size:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.hidden{display:none!important}.exercise{border-top:1px solid #343947;padding:12px 0}.sets{display:grid;grid-template-columns:35px 1fr 1fr 35px;gap:7px;align-items:center}.sets input{margin:0;padding:9px}.chart{width:100%;height:180px;display:block}.notice{border-left:3px solid #b4f26c;padding:9px 12px;background:#242c2c;border-radius:6px;font-size:13px}.empty{text-align:center;padding:30px 10px;color:#9da3b2}.tag{font-size:12px;color:#b4f26c}a{color:#b4f26c}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.full{width:100%}small{color:#a5a9b7}details summary{cursor:pointer;font-weight:600} .chartline{fill:none;stroke:#b4f26c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{fill:#b4f26c} .divider{border-top:1px solid #303544;margin:12px 0}
</style></head><body><header><div class="row"><div><h1>💪 RepTrack</h1><div class="muted">Train smarter. Get stronger.</div></div><span class="pill" id="today"></span></div></header><main class="wrap" id="app"></main><nav id="nav"></nav><script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.innerHTML.trim()){a.innerHTML='<div class="card"><h3>Something went wrong</h3><p class="muted">'+String(e.message).replace(/</g,"&lt;")+'</p><p class="muted">Try closing and reopening the app. Your saved workouts are not affected.</p></div>'}});</script><script src="app.js"></script></body></html>
